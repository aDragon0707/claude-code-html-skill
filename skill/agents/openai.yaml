interface:
  display_name: "Claude Code HTML Skill"
  short_description: "Offline HTML artifacts and research publications"
  default_prompt: "Decide whether this task passes the HTML gate. If comparison, flow, spatial relationships, state, interaction, or focused export materially benefits from HTML, create one self-contained offline artifact using the matching pattern. For architecture, workflow, sequence, dataflow, or lifecycle diagrams, route the diagram through the bundled Archify renderer and validate before delivery. Otherwise, keep the result in chat or Markdown and briefly explain why."
